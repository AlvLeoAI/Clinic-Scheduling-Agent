[project]
name = "clinic-scheduling-agent"
version = "0.1.0"
description = "Synthetic clinic scheduling backend prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not agent_live'"
markers = [
  "unit: deterministic checks without PostgreSQL or a real provider",
  "postgres: requires the isolated real PostgreSQL test database",
  "api: authenticated and public HTTP contracts",
  "agent_offline: synthetic fake-provider agent, protocol or grader checks",
  "agent_live: reserved for separately authorized opt-in live evaluations",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
