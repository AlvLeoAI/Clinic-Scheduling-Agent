name: Infrastructure static checks

# No AWS credentials: nothing here can read or change the account.
on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Terraform and TFLint (SHA-256 verified)
        run: |
          infra/tools/install.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: terraform validate (no backend, no credentials)
        run: |
          for root in infra/terraform/bootstrap infra/terraform/app; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit only
        run: |
          tflint --init --config "$PWD/infra/terraform/.tflint.hcl"
          tflint --recursive --chdir infra/terraform --config "$PWD/infra/terraform/.tflint.hcl"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: checkov (hash-locked)
        run: |
          python -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --require-hashes -r infra/tools/checkov.lock
          "$RUNNER_TEMP/checkov/bin/checkov" -d infra/terraform --framework terraform --compact --quiet
